[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clutt3r-seg"
version = "0.1.0"
description = "Release package for Clutt3R-Seg segmentation and scene update."
license = { file = "LICENSE" }
requires-python = ">=3.10"
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy",
    "opencv-python",
    "open3d",
    "torch",
    "torchvision",
    "torchmetrics",
    "Pillow",
    "networkx",
    "pandas",
    "scipy",
    "scikit-learn",
    "joblib",
    "matplotlib",
    "huggingface-hub",
    "lightning",
    "hydra-core",
    "omegaconf",
    "timm",
    "tqdm",
]

[tool.setuptools.packages.find]
include = ["clutt3rseg*"]

# ---------------------------------------------------------------------------
# pixi environment.
#
# Mirrors the upstream Docker base (pytorch/pytorch:2.4.1-cuda12.1) without
# Docker so the segmenter can run under `pixi run` like the other baselines.
# DuoduoCLIP is fetched separately by the `setup_duoduo_clip` task (it is not
# redistributed here) and discovered through DUODUOCLIP_ROOT set below.
# ---------------------------------------------------------------------------
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-options.dependency-overrides]
numpy = "<2.0"

[tool.pixi.pypi-dependencies]
# Pin torch/torchvision to the cu121 wheels matching the upstream Docker base.
torch = { version = "==2.4.1", index = "https://download.pytorch.org/whl/cu121" }
torchvision = { version = "==0.19.1", index = "https://download.pytorch.org/whl/cu121" }
# The clutt3r-seg package itself (exposes the `clutt3rseg` import package and
# pulls in its declared runtime dependencies: open3d, opencv-python, lightning,
# hydra-core, timm, ...).
clutt3r-seg = { path = ".", editable = true }
# Shared deg interchange types used by the segment.py glue.
psdframe = { path = "../../packages/psdframe", editable = true }
initializerdefs = { path = "../../packages/initializerdefs", editable = true }
psdstaticdataset = { path = "../../packages/psdstaticdataset", editable = true }
# CLI parsing for segment.py (matches the other baselines' segmenter entry points).
tyro = ">=0.8"
# Extra DuoduoCLIP requirements not already in [project.dependencies].
h5py = ">=3.0"
wandb = ">=0.16"
# Grounded-SAM (GroundingDINO + SAM) mask front-end, run via HuggingFace transformers.
# <5: the Grounded-SAM front end is written against the transformers 4.x API.
transformers = ">=4.44,<5"
# DuoduoCLIP's modified open_clip (installs as open_clip_torch). The rest of
# DuoduoCLIP is a source tree, not a package, so scripts/setup_duoduo_clip.sh
# clones it -- keep that script's DUODUOCLIP_REV equal to the rev below.
open_clip_torch = { git = "https://github.com/3dlg-hcvc/DuoduoCLIP.git", subdirectory = "open_clip_mod", rev = "3111a77041fc82e656fe589bd7737b41ea34c10d" }

[tool.pixi.dependencies]
python = "3.11.*"
pip = ">=24"
setuptools = ">=68"
wheel = "*"
git = ">=2.40"
# System libraries the pypi wheels dlopen but do not bundle: libglib/libgthread
# and libGL for opencv-python, libgomp for open3d. Without them the imports fail
# at runtime even though `pixi install` succeeds.
libglib = ">=2.80"
libgl = "*"
libgomp = "*"

[tool.pixi.activation]
# DuoduoCLIP is cloned here by `pixi run setup_duoduo_clip`; the clip backend
# discovers it via DUODUOCLIP_ROOT (see clutt3rseg/clip_backends/duoduo.py).
# LD_LIBRARY_PATH: the pypi open3d/opencv wheels carry no RPATH into the conda
# env, so they cannot find libgomp/libglib there without this.
env = { DUODUOCLIP_ROOT = "$PIXI_PROJECT_ROOT/external/DuoduoCLIP", LD_LIBRARY_PATH = "$CONDA_PREFIX/lib:$LD_LIBRARY_PATH" }

[tool.pixi.tasks]
# Clones the DuoduoCLIP source tree DUODUOCLIP_ROOT points at. `outputs` makes
# this a cache hit once cloned, so it is safe to hang off segment_external.
setup_duoduo_clip = { cmd = "bash scripts/setup_duoduo_clip.sh external/DuoduoCLIP", inputs = [
    "scripts/setup_duoduo_clip.sh",
], outputs = [
    "external/DuoduoCLIP/src/model/wrapper.py",
] }
# deg external-segmenter entry point (transforms.json + scene.pkl -> objects).
segment_external = { cmd = "python segment.py", depends-on = ["setup_duoduo_clip"] }
# Native upstream entry points (useful for sample-sequence validation).
run_initial = "bash scripts/run_initial.sh"
run_update = "bash scripts/run_update.sh"
